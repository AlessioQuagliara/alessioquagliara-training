<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road to Boxing — Forza, Footwork e Conditioning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar panel" aria-label="Barra principale">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 34L24 12L37 34" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 34H30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Programma A / B / C</h1>
          <p>Push, pull, gambe, sacco e timer recupero da telefono</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="chip-btn" type="button" id="expandAllBtn">Apri tutto</button>
        <button class="chip-btn" type="button" id="collapseAllBtn">Chiudi blocchi</button>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Passa alla modalità chiara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-main panel" id="heroMain"></div>

      <aside class="timer-panel panel" aria-labelledby="timer-title">
        <div class="timer-top">
          <div>
            <h3 id="timer-title">Timer recupero</h3>
            <p>Usalo per 45, 60, 90 o 120 secondi. Puoi anche avviarlo da ogni esercizio.</p>
          </div>
          <span class="tag">Mobile ready</span>
        </div>

        <div class="timer-display" aria-live="polite">
          <div class="time" id="timerDisplay">01:00</div>
          <div class="hint" id="timerHint">Preset attuale: 60 secondi</div>
        </div>

        <div class="timer-presets" aria-label="Preset timer">
          <button class="chip-btn" type="button" data-preset="45">45 sec</button>
          <button class="chip-btn" type="button" data-preset="60" data-active="true">60 sec</button>
          <button class="chip-btn" type="button" data-preset="90">90 sec</button>
          <button class="chip-btn" type="button" data-preset="120">120 sec</button>
        </div>

        <div class="timer-controls">
          <button class="timer-btn primary" type="button" id="startPauseBtn">Avvia</button>
          <button class="timer-btn" type="button" id="resetBtn">Reset</button>
        </div>

        <div class="timer-status" id="timerStatus">Pronto al recupero.</div>
      </aside>
    </section>

    <main class="days" id="days"></main>

    <section class="notes-panel" id="notes"></section>

    <p class="footer-note" id="footerNote"></p>
  </div>
</body>
</html>
